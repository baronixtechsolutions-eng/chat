services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://chat:chat@db:5432/chat
      FRONTEND_URL: http://localhost:3000
      # Local default only. Set JWT_SECRET in a .env file next to this compose file for anything else
      JWT_SECRET: ${JWT_SECRET:-docker-local-secret-change-me-before-deploying}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Test runners: only start with `docker compose run --rm <service>`
  backend-test:
    profiles: [test]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      TEST_DATABASE_URL: postgres://chat:chat@db:5432/chat_test
    command: sh -c "npm ci --no-audit --no-fund && npm test"
    depends_on:
      db:
        condition: service_healthy

  frontend-test:
    profiles: [test]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm test"

volumes:
  db-data:
